[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reckon_accounts_saas"
version = "0.1.0"
authors = [{name = "Reckon Technologies Ltd."}]
description = "Single-company SaaS accounting, sales, purchase and stock on ERPNext"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.setuptools.packages.find]
include = ["reckon_accounts_saas*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["frappe", "erpnext", "reckon_saas_platform", "reckon_accounts"]
