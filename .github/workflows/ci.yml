name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff tomli

      - name: Validate app metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          deps = data["tool"]["bench"]["frappe-dependencies"]
          assert deps["frappe"] == ">=15.0.0,<17.0.0", deps["frappe"]
          assert deps["erpnext"] == ">=15.0.0,<17.0.0", deps["erpnext"]
          assert Path("reckon_accounts_saas/modules.txt").read_text().strip() == "Accounts SaaS"
          hooks = Path("reckon_accounts_saas/hooks.py").read_text()
          assert '"reckon_saas_platform"' in hooks and '"reckon_accounts"' in hooks
          PY

      - name: Compile Python and validate JSON
        run: |
          python -m compileall -q reckon_accounts_saas
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("reckon_accounts_saas").rglob("*.json"):
              json.loads(path.read_text())
          PY

      - name: Lint Python
        run: ruff check .

      - name: Run database-free regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
